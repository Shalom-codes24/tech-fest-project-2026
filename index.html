<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f1" />
    <meta
      name="description"
      content="Register for Jos TechFest 2026 in Jos, Nigeria."
    />
    <title>Register | Jos TechFest 2026</title>
    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #17241d;
        background: #f5f6f1;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --green: #24583d;
        --muted: #6a756e;
        --line: #e2e8e1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 48px 18px;
        background:
          radial-gradient(ellipse at 10% 0%, #e9f0dd 0, transparent 30rem),
          #f5f6f1;
      }

      main {
        width: min(100%, 560px);
        margin: 0 auto;
      }

      .event-label {
        margin: 0 0 10px;
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 8vw, 48px);
        letter-spacing: -0.06em;
        line-height: 1.05;
      }

      .theme {
        margin: 12px 0 0;
        color: #45554a;
        font-size: 15px;
        line-height: 1.5;
      }

      .event-details {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        margin: 18px 0 27px;
        color: var(--muted);
        font-size: 12px;
      }

      .event-details span::before {
        margin-right: 7px;
        color: #75a24c;
        content: "•";
      }

      .card {
        padding: clamp(22px, 6vw, 32px);
        border: 1px solid #e8ebe5;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 36px rgb(34 54 37 / 6%);
      }

      .card h2 {
        margin: 0;
        font-size: 19px;
        letter-spacing: -0.035em;
      }

      .intro {
        margin: 7px 0 24px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .field {
        margin-top: 17px;
      }

      .field:first-of-type {
        margin-top: 0;
      }

      label,
      legend {
        display: block;
        margin-bottom: 7px;
        color: #29372e;
        font-size: 12px;
        font-weight: 700;
      }

      .required {
        color: #a03d35;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"],
      select {
        width: 100%;
        min-height: 45px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        background: #fff;
        color: #17241d;
        font: inherit;
        font-size: 13px;
      }

      input::placeholder {
        color: #9aa49c;
      }

      input:focus-visible,
      select:focus-visible,
      button:focus-visible,
      a:focus-visible {
        border-color: #769a5a;
        box-shadow: 0 0 0 3px rgb(118 154 90 / 20%);
      }

      fieldset {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .choices {
        display: grid;
        gap: 8px;
      }

      .choice {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 39px;
        margin: 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: #3e4c42;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
      }

      .choice:has(input:checked) {
        border-color: #9ab38b;
        background: #f2f6ed;
      }

      .choice input {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--green);
      }

      .consent {
        margin: 19px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }

      button {
        display: flex;
        width: 100%;
        min-height: 47px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
        border: 0;
        border-radius: 9px;
        background: var(--green);
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 750;
      }

      button:hover {
        background: #19432e;
      }

      button span {
        color: #d7ed96;
        font-size: 17px;
      }

      .status {
        min-height: 18px;
        margin: 12px 0 0;
        color: #24583d;
        font-size: 12px;
        line-height: 1.5;
      }

      .status.error {
        color: #a03d35;
      }

      .updates {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 14px;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.5;
      }

      .updates input {
        flex: 0 0 auto;
        margin: 1px 0 0;
        accent-color: var(--green);
      }

      @media (max-width: 480px) {
        body {
          padding: 32px 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="event-label">Registration</p>
        <h1>Jos TechFest 2026</h1>
        <p class="theme">AI × Industry: Automating the Future of Work</p>
        <div class="event-details">
          <span>November 26–27, 2026</span>
          <span>Sarau Event Center, Jos</span>
        </div>
      </header>

      <section class="card" aria-labelledby="form-heading">
        <h2 id="form-heading">Save your spot</h2>
        <p class="intro">Just a few details and you’re in.</p>

        <form id="registration-form" novalidate>
          <div class="field">
            <label for="full-name">Your name <span class="required">*</span></label>
            <input id="full-name" name="name" type="text" autocomplete="name" placeholder="Full name" required />
          </div>

          <div class="field">
            <label for="email">Email address <span class="required">*</span></label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="whatsapp">WhatsApp number <span class="required">*</span></label>
            <input id="whatsapp" name="whatsapp" type="tel" autocomplete="tel" placeholder="+234 800 000 0000" required />
          </div>

          <div class="field">
            <label for="attendee-type">Which best describes you? <span class="required">*</span></label>
            <select id="attendee-type" name="attendeeType" required>
              <option value="" disabled selected>Select one</option>
              <option>Developer</option>
              <option>Product designer</option>
              <option>AI / ML engineer</option>
              <option>Web3 builder</option>
              <option>Founder / business leader</option>
              <option>Student</option>
              <option>Other</option>
            </select>
          </div>

          <fieldset class="field">
            <legend>Which day will you attend? <span class="required">*</span></legend>
            <div class="choices">
              <label class="choice"><input type="radio" name="attendance" value="November 26" required /> November 26</label>
              <label class="choice"><input type="radio" name="attendance" value="November 27" /> November 27</label>
              <label class="choice"><input type="radio" name="attendance" value="Both days" /> Both days</label>
            </div>
          </fieldset>

          <p class="consent">By registering, you agree that we can use these details to organize the event.</p>
          <label class="updates">
            <input type="checkbox" name="updates" value="Yes" />
            <span>Send me occasional event updates by email or WhatsApp.</span>
          </label>

          <button type="submit">Register for Jos TechFest <span aria-hidden="true">→</span></button>
          <p class="status" id="form-status" role="status" aria-live="polite"></p>
        </form>
        <iframe
          id="sheets-response"
          name="sheets-response"
          title="Registration submission response"
          hidden
        ></iframe>
      </section>
    </main>

    <script>
      // Paste the deployed Apps Script web app URL here; see SETUP.txt.
      const SHEETS_WEB_APP_URL =
        "https://script.google.com/macros/s/AKfycbzp3JvFCb_dhKhvTDT_XhrizhdKfxUgvtqCcrz6VfJrsTAwyCQlu28lYwWbHer30FE/exec";

      const form = document.querySelector("#registration-form");
      const status = document.querySelector("#form-status");
      const responseFrame = document.querySelector("#sheets-response");
      let responseTimeout;

      window.addEventListener("message", (event) => {
        if (
          event.source !== responseFrame.contentWindow ||
          event.data?.type !== "JTF_REGISTRATION_RESULT"
        ) {
          return;
        }

        window.clearTimeout(responseTimeout);
        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = false;
        status.classList.toggle("error", !event.data.success);

        if (event.data.success) {
          form.reset();
          status.textContent = "You’re registered! Your response has been saved.";
        } else {
          status.textContent =
            "We couldn’t save your registration. Please try again in a moment.";
        }
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        status.classList.remove("error");

        if (!form.reportValidity()) return;

        if (!SHEETS_WEB_APP_URL) {
          status.textContent =
            "The form is ready, but spreadsheet submission has not been connected yet. Follow SETUP.txt to finish setup.";
          status.classList.add("error");
          return;
        }

        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        status.textContent = "Sending your registration…";
        form.action = SHEETS_WEB_APP_URL;
        form.method = "post";
        form.target = responseFrame.name;
        form.submit();
        window.clearTimeout(responseTimeout);
        responseTimeout = window.setTimeout(() => {
          submitButton.disabled = false;
          status.textContent =
            "We couldn’t confirm your registration. Please try again in a moment.";
          status.classList.add("error");
        }, 20000);
      });
    </script>
  </body>
</html>
